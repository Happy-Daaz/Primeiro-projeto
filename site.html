<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTEC Tecnologia - Loja de Eletrônicos</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <img src="IMG/LogoDoSIte.png" alt="HTEC Tecnologia" class="logo">
            
            <div class="busca-container">
                <input type="text" id="buscador" name="buscador" placeholder="O que você está procurando hoje?">
            </div>
            
            <div class="icones">
                <a href="Cadastro.html" title="Minha Conta"><img src="IMG/icone-cadastro.png" alt="Cadastro"></a>
                <img src="IMG/coraçao.png" alt="Favoritos">
               <img src="IMG/atencao-cliente.png" alt="Atendimento">
               <img src="IMG/carrinho.png" alt="Carrinho">
            </div>
        </div>
    </header>

    <main class="container-principal">
        <h2 class="titulo-secao">Produtos em Destaque</h2>
        
        <div class="container-produto">
            <div class="item-produto">
                <div class="produto-imagem">
                    <img src="IMG/mouse.webp" alt="Mouse Gamer">
                </div>
                <h3>Mouse Gamer</h3>
                <span class="preco">R$ 50,00</span>
                <a href="SiteDoMouse.html" class="btn-comprar">Comprar</a>
            </div>

            <div class="item-produto">
                <div class="produto-imagem">
                    <img src="IMG/images.jpg" alt="Head Set Gamer">
                </div>
                <h3>Headset Gamer</h3>
                <span class="preco">R$ 100,00</span>
                <a href="SiteDoHeadSet.html" class="btn-comprar">Comprar</a>
            </div>

            <div class="item-produto">
                <div class="produto-imagem">
                    <img src="IMG/teclado.webp" alt="Teclado">
                </div>
                <h3>Teclado Gamer</h3>
                <span class="preco">R$ 150,00</span>
                <a href="SiteDoTeclado.html" class="btn-comprar">Comprar</a>
            </div>

            <div class="item-produto">
                <div class="produto-imagem">
                    <img src="IMG/celular Iphone.webp" alt="Iphone">
                </div>
                <h3>iPhone 17 Pro Max Turbo</h3>
                <span class="preco">R$ 10.000,00</span>
                <a href="SiteDoIphone.html" class="btn-comprar">Comprar</a>
            </div>
        </div>
    </main>

</body>
</html>
