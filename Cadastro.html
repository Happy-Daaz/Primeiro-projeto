<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="TelaCadastro.css">
</head>
<body>

    <form action="site.html" method="POST">
        <h2>Cadastro</h2>
        
        <div class="campo-grupo">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        
        <div class="campo-grupo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="campo-grupo">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" maxlength="11" inputmode="numeric" required>
        </div>
        
        <div class="campo-grupo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div class="campo-grupo">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" maxlength="8" inputmode="numeric" placeholder="Apenas números" required>
        </div>

        <div class="campo-grupo">
            <label for="rua">Rua:</label>
            <input type="text" id="rua" name="rua" required>
        </div>

      
        <div class="linha-dupla">
            <div style="flex: 1;">
                <label for="numero">Número:</label>
                <input type="text" id="numero" name="numero" required>
            </div>
            <div style="flex: 2;">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="bairro" required>
            </div>
        </div>

       
        <div class="linha-dupla">
            <div style="flex: 3;">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
            </div>
            <div style="flex: 1;">
                <label for="estado">UF:</label>
                <input type="text" id="estado" name="estado" maxlength="2" placeholder="SP" required>
            </div>
        </div>
        
       
        <div class="campo-checkbox">
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Aceito os termos e condições</label>
        </div>
        
      
        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
