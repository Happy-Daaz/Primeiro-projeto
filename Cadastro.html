<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="TelaCadastro.css">
</head>
<body>
    <form action="/enviar-cadastro" method="POST">
        <h2>Cadastro</h2>
        
        <div>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        
        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" maxlength="11" inputmode="numeric" required>
        </div>
        
        <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div>
            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" maxlength="8" inputmode="numeric" placeholder="Apenas números" required>
        </div>

        <div>
            <label for="rua">Rua:</label>
            <input type="text" id="rua" name="rua" required>
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1; margin: 0;">
                <label for="numero">Número:</label>
                <input type="text" id="numero" name="numero" required>
            </div>
            <div style="flex: 2; margin: 0;">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" name="bairro" required>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 3; margin: 0;">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
            </div>
            <div style="flex: 1; margin: 0;">
                <label for="estado">UF:</label>
                <input type="text" id="estado" name="estado" maxlength="2" placeholder="SP" required>
            </div>
        </div>
        
        <div>
            <input type="checkbox" id="termos" name="termos" required>
            <label for="termos">Aceito os termos e condições</label>
        </div>
        
        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
